name: build-base-image

# Weekly rebuild of the Debian base images, plus manual runs. The gate keeps a
# scheduled run from rebuilding/pushing when nothing changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"   # Tuesday 04:17 UTC (off the on-the-hour crowd)
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite/codename to build (blank = current stable + oldstable)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Resolve which suites to build. Default = stable + oldstable, read live from
  # Debian's Release files so codenames are never hardcoded.
  # --------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      owner: ${{ steps.r.outputs.owner }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          resolve() { curl -sfL "https://deb.debian.org/debian/dists/$1/Release" | sed -n 's/^Codename: //p'; }
          IN="${{ github.event.inputs.suite }}"
          if [ -n "$IN" ]; then
            case "$IN" in
              stable)    matrix="[{\"codename\":\"$(resolve stable)\",\"aliases\":[\"stable\",\"latest\"]}]" ;;
              oldstable) matrix="[{\"codename\":\"$(resolve oldstable)\",\"aliases\":[\"oldstable\"]}]" ;;
              testing)   matrix="[{\"codename\":\"$(resolve testing)\",\"aliases\":[\"testing\"]}]" ;;
              *)         matrix="[{\"codename\":\"$IN\",\"aliases\":[]}]" ;;
            esac
          else
            matrix="[{\"codename\":\"$(resolve stable)\",\"aliases\":[\"stable\",\"latest\"]},{\"codename\":\"$(resolve oldstable)\",\"aliases\":[\"oldstable\"]}]"
          fi
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Per-suite gate: keep only the suites that actually need a rebuild.
  # --------------------------------------------------------------------------
  gate:
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.g.outputs.matrix }}
      any: ${{ steps.g.outputs.any }}
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: g
        run: |
          set -euo pipefail
          out="[]"
          for row in $(echo '${{ needs.resolve.outputs.matrix }}' | jq -c '.[]'); do
            code=$(echo "$row" | jq -r '.codename')
            echo "::group::gate ${code}"
            res=$(IMAGE="${GHCR_IMAGE}:${code}" VCS_REF="${{ github.sha }}" ./need_rebuild.sh || true)
            echo "$res"
            echo "::endgroup::"
            if echo "$res" | grep -q '^REBUILD=true'; then
              out=$(echo "$out" | jq -c ". + [$row]")
            fi
          done
          echo "matrix=$out" | tee -a "$GITHUB_OUTPUT"
          [ "$(echo "$out" | jq 'length')" -gt 0 ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Build each needed suite natively per arch and push per-arch tags.
  # --------------------------------------------------------------------------
  build:
    needs: [resolve, gate]
    if: needs.gate.outputs.any == 'true'
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.gate.outputs.matrix) }}
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/debian
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Install debootstrap
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring
      - name: Build and push per-arch image
        env:
          IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian:${{ matrix.suite.codename }}-${{ matrix.arch.name }}
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          export BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sudo -E ./build_base_system.sh "${{ matrix.suite.codename }}" "${{ matrix.arch.name }}"
          docker push "$IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            docker tag "$IMAGE" "${DOCKERHUB_IMAGE}:${{ matrix.suite.codename }}-${{ matrix.arch.name }}"
            docker push "${DOCKERHUB_IMAGE}:${{ matrix.suite.codename }}-${{ matrix.arch.name }}"
          fi

  # --------------------------------------------------------------------------
  # Merge the per-arch tags into the codename tag + aliases, per registry.
  # --------------------------------------------------------------------------
  manifest:
    needs: [resolve, gate, build]
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/debian
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          CODE: ${{ matrix.suite.codename }}
          TAGS: ${{ matrix.suite.codename }} ${{ join(matrix.suite.aliases, ' ') }}
        run: |
          set -euo pipefail
          push_manifest() {  # $1 = image repo
            local repo="$1"; local args=()
            for t in $TAGS; do args+=(-t "${repo}:${t}"); done
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=Minimal Debian base image (amd64/arm64)" \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              "${args[@]}" \
              "${repo}:${CODE}-amd64" "${repo}:${CODE}-arm64"
          }
          push_manifest "$GHCR_IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            push_manifest "$DOCKERHUB_IMAGE"
          fi
