name: build-base-image

# Weekly rebuild of the Debian base images, plus manual runs. The gate keeps a
# scheduled run from rebuilding/pushing when nothing changed.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"   # Tuesday 04:17 UTC (off the on-the-hour crowd)
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite/codename to build (blank = current stable + oldstable)"
        required: false
        default: ""
      force:
        description: "Build even if the gate sees no change"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Resolve which suites to build. Default = stable + oldstable, read live from
  # Debian's Release files so codenames are never hardcoded.
  # --------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
      owner: ${{ steps.r.outputs.owner }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          resolve() { curl -sfL "https://deb.debian.org/debian/dists/$1/Release" | sed -n 's/^Codename: //p'; }
          IN="${{ github.event.inputs.suite }}"
          if [ -n "$IN" ]; then
            case "$IN" in
              stable)    matrix="[{\"codename\":\"$(resolve stable)\",\"aliases\":[\"stable\",\"latest\"]}]" ;;
              oldstable) matrix="[{\"codename\":\"$(resolve oldstable)\",\"aliases\":[\"oldstable\"]}]" ;;
              testing)   matrix="[{\"codename\":\"$(resolve testing)\",\"aliases\":[\"testing\"]}]" ;;
              *)         matrix="[{\"codename\":\"$IN\",\"aliases\":[]}]" ;;
            esac
          else
            matrix="[{\"codename\":\"$(resolve stable)\",\"aliases\":[\"stable\",\"latest\"]},{\"codename\":\"$(resolve oldstable)\",\"aliases\":[\"oldstable\"]}]"
          fi
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Per-suite gate: keep only the suites that actually need a rebuild.
  # --------------------------------------------------------------------------
  gate:
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.g.outputs.matrix }}
      any: ${{ steps.g.outputs.any }}
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: g
        run: |
          set -euo pipefail
          FORCE="${{ github.event.inputs.force }}"
          out="[]"
          for row in $(echo '${{ needs.resolve.outputs.matrix }}' | jq -c '.[]'); do
            code=$(echo "$row" | jq -r '.codename')
            if [ "$FORCE" = "true" ]; then
              echo "forced build (manual dispatch): ${code}"
              out=$(echo "$out" | jq -c ". + [$row]")
              continue
            fi
            echo "::group::gate ${code}"
            res=$(IMAGE="${GHCR_IMAGE}:${code}" VCS_REF="${{ github.sha }}" ./need_rebuild.sh || true)
            echo "$res"
            echo "::endgroup::"
            if echo "$res" | grep -q '^REBUILD=true'; then
              out=$(echo "$out" | jq -c ". + [$row]")
            fi
          done
          echo "matrix=$out" | tee -a "$GITHUB_OUTPUT"
          [ "$(echo "$out" | jq 'length')" -gt 0 ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Build each needed suite natively per arch and push per-arch tags.
  # --------------------------------------------------------------------------
  build:
    needs: [resolve, gate]
    if: needs.gate.outputs.any == 'true'
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.gate.outputs.matrix) }}
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/debian
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Install debootstrap
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends debootstrap debian-archive-keyring
      - name: Build rootfs tarball
        env:
          TARBALL: rootfs.tar
        run: sudo -E ./build_base_system.sh "${{ matrix.suite.codename }}" "${{ matrix.arch.name }}"
      - name: Build & push per-arch image (OCI + attestations)
        env:
          CODE: ${{ matrix.suite.codename }}
          ARCH_NAME: ${{ matrix.arch.name }}
          VCS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo chown "$(id -u):$(id -g)" rootfs.tar
          mkdir -p ctx && mv rootfs.tar ctx/rootfs.tar
          tags=(-t "${GHCR_IMAGE}:${CODE}-${ARCH_NAME}")
          [ -n "$DOCKERHUB_USERNAME" ] && tags+=(-t "${DOCKERHUB_IMAGE}:${CODE}-${ARCH_NAME}")
          docker buildx build ctx -f Dockerfile \
            --platform "linux/${ARCH_NAME}" \
            "${tags[@]}" \
            --output type=image,oci-mediatypes=true,push=true \
            --attest type=provenance,mode=max \
            --attest type=sbom \
            --build-arg "IMAGE_VERSION=${CODE}" \
            --build-arg "IMAGE_REVISION=${VCS_REF}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_SOURCE=${SOURCE_URL}"

  # --------------------------------------------------------------------------
  # Merge the per-arch tags into the codename tag + aliases, per registry.
  # --------------------------------------------------------------------------
  manifest:
    needs: [resolve, gate, build]
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      GHCR_IMAGE: ghcr.io/${{ needs.resolve.outputs.owner }}/debian
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/debian
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifests
        env:
          CODE: ${{ matrix.suite.codename }}
          TAGS: ${{ matrix.suite.codename }} ${{ join(matrix.suite.aliases, ' ') }}
        run: |
          set -euo pipefail
          push_manifest() {  # $1 = image repo
            local repo="$1"; local args=()
            for t in $TAGS; do args+=(-t "${repo}:${t}"); done
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=Minimal Debian base image (amd64/arm64)" \
              --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
              "${args[@]}" \
              "${repo}:${CODE}-amd64" "${repo}:${CODE}-arm64"
          }
          push_manifest "$GHCR_IMAGE"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            push_manifest "$DOCKERHUB_IMAGE"
          fi

  # --------------------------------------------------------------------------
  # Prune untagged GHCR versions left behind by overwritten tags. Multi-arch
  # aware: child manifests of a live tagged image are preserved. (Docker Hub is
  # tag-centric and self-GCs, so no equivalent step is needed there.)
  # --------------------------------------------------------------------------
  cleanup:
    needs: [resolve, gate, manifest]
    if: needs.gate.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Prune untagged GHCR versions
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ needs.resolve.outputs.owner }}
          packages: debian
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Regenerate the Docker Hub overview: a short intro linking to the GitHub
  # README, a summary row per published image, and the exact version of every
  # installed package, read from each image's SBOM attestation (per arch when
  # amd64 and arm64 differ). Tags are read live from Docker Hub and grouped by
  # digest, so aliases share one section. Runs on every run, so the page always
  # matches what is live — even when nothing was rebuilt.
  # --------------------------------------------------------------------------
  describe:
    needs: [resolve, manifest]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/debian
      SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      KEY_PACKAGES: "libc6 openssl apt"   # packages given their own summary column
    steps:
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Generate overview
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          set -euo pipefail
          # imagetools inspect with retries: a registry read right after a push can
          # fail transiently, and a tag silently missing from the page is worse than
          # a failed job (the previous overview then stays up).
          inspect() {  # $1 = image ref, $2 = --format template
            local i
            for i in 1 2 3; do
              docker buildx imagetools inspect "$1" --format "$2" && return 0
              echo "inspect $1 failed (attempt $i/3)" >&2
              sleep $((i * 10))
            done
            echo "::error::could not inspect $1" >&2
            return 1
          }
          out="${RUNNER_TEMP}/hub-overview.md"
          tables="${RUNNER_TEMP}/hub-tables.md"
          {
            echo "# debian"
            echo
            echo "Minimal, **systemd-free** Debian base images built from scratch (\`debootstrap --variant=minbase\`),"
            echo "multi-arch (\`amd64\` + \`arm64\`), for the current stable and oldstable releases. Rebuilt weekly,"
            echo "but only when there is something new to ship (a config change or pending package updates)."
            echo
            echo "**Documentation**: ${SOURCE_URL}#readme"
            echo
            echo "## Summary"
            echo
            printf '| Tags | Debian |'; for k in $KEY_PACKAGES; do printf ' %s |' "$k"; done; echo ' Built | Packages | Arches |'
            printf '| --- | --- |'; for k in $KEY_PACKAGES; do printf ' --- |'; done; echo ' --- | --- | --- |'
          } > "$out"
          {
            echo
            echo "## Installed packages"
            echo
            echo "Generated $(date -u +%Y-%m-%d) from each image's SBOM attestation. Versions that differ"
            echo "between \`amd64\` and \`arm64\` are shown per arch."
          } > "$tables"
          # Shared jq helpers: Debian packages per arch (name -> version), arch
          # comparison ignoring binNMU suffixes (+bN), upstream version (epoch
          # and Debian revision stripped).
          defs='
            def pk(p): [ .[p].SPDX.packages[]?
                         | select(any(.externalRefs[]?; .referenceLocator | startswith("pkg:deb/")))
                         | {(.name): (.versionInfo // "")} ] | add // {};
            def same(a; b): ((a // "") | sub("\\+b[0-9]+$"; "")) == ((b // "") | sub("\\+b[0-9]+$"; ""));
            def up(x): (x // "?") | sub("^[0-9]+:"; "") | sub("-[^-]*$"; "");
            def distro(p): [ .[p].SPDX.packages[]?.externalRefs[]?.referenceLocator
                             | capture("distro=debian-(?<v>[0-9.]+)").v ] | first // "?";
            pk("linux/amd64") as $a | pk("linux/arm64") as $b'
          # Published tags (per-arch -amd64/-arm64 helpers dropped), grouped by
          # digest; codename before alias names, the group holding :latest first.
          groups=$(curl -sfL "https://hub.docker.com/v2/repositories/${DOCKERHUB_IMAGE}/tags?page_size=100" \
            | jq -c '[.results[] | select(.name | test("-(amd64|arm64)$") | not)]
              | group_by(.digest)
              | map({digest: .[0].digest,
                     tags: (map(.name) | sort_by(if . == "latest" then 2 elif test("^(old)?stable$|^testing$") then 1 else 0 end, .))})
              | sort_by(if (.tags | index("latest")) then 0 else 1 end, .tags[0]) | .[]')
          while read -r g; do
            [ -n "$g" ] || continue
            ref="${DOCKERHUB_IMAGE}@$(jq -r .digest <<<"$g")"
            title=$(jq -r '.tags | map("`:\(.)`") | join(" · ")' <<<"$g")
            sbom=$(inspect "$ref" '{{ json .SBOM }}')
            built=$(inspect "$ref" '{{ json .Image }}' \
              | jq -r '[.[] | .config.Labels["org.opencontainers.image.created"] // empty] | max // "?" | .[0:10]')
            jq -r --arg title "$title" --arg built "$built" --arg keys "$KEY_PACKAGES" "$defs"'
              | ([ $a + $b | keys[] | select(same($a[.]; $b[.]) | not) ] | length) as $n
              | "| \($title) | \(distro("linux/amd64")) | "
                + ([ $keys | splits(" +") | select(length > 0) as $k
                     | if same($a[$k]; $b[$k]) then up($a[$k] // $b[$k])
                       else "\(up($a[$k])) (amd64) · \(up($b[$k])) (arm64)" end ] | map(. + " | ") | add // "")
                + "\($built) | \($a | length) | "
                + (if $n == 0 then "✅ identical" else "⚠ \($n) packages differ" end) + " |"' <<<"$sbom" >> "$out"
            {
              echo
              echo "### ${title}"
              echo
              echo "| Package | Version |"
              echo "| --- | --- |"
              jq -r "$defs"'
                | ($a + $b | keys[]) as $n
                | if same($a[$n]; $b[$n]) then "| \($n) | `\($a[$n] // $b[$n])` |"
                  else "| \($n) | amd64 `\($a[$n] // "—")` · arm64 `\($b[$n] // "—")` ⚠ |" end' <<<"$sbom"
            } >> "$tables"
          done <<<"$groups"
          cat "$tables" >> "$out"
          echo "overview: $(wc -c < "$out") bytes (Docker Hub limit 25000)"
          cat "$out"
      - name: Push overview to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ${{ runner.temp }}/hub-overview.md

  # --------------------------------------------------------------------------
  # Keep the schedule alive. GitHub disables cron workflows in public repos
  # after 60 days without repo activity; re-enabling via the API resets that.
  # --------------------------------------------------------------------------
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
